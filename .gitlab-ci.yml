# GitLab CI/CD Pipeline para Laravel
# Stages: Build → Test → Deploy (Staging)

stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY: "registry.gitlab.com"
  IMAGE_NAME: "${REGISTRY}/${CI_PROJECT_PATH}"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"

# === BUILD STAGE ===

build:image:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} -t ${IMAGE_NAME}:latest .
    - docker push ${IMAGE_NAME}:${IMAGE_TAG}
    - docker push ${IMAGE_NAME}:latest
  only:
    - main
    - develop
    - merge_requests
  tags:
    - docker
  allow_failure: false

# === TEST STAGE ===

test:unit:
  stage: test
  image: ${IMAGE_NAME}:${IMAGE_TAG}
  services:
    - docker:24-dind
  before_script:
    - php -r "file_exists('.env') || copy('.env.example', '.env');"
    - cp .env.example .env
    - echo "DB_DATABASE=/tmp/database.sqlite" >> .env
    - composer install --no-interaction --no-progress
    - touch /tmp/database.sqlite
  script:
    - php artisan migrate --database=testing --force
    - php artisan test --testsuite=Unit --stop-on-failure
  coverage: '/Lines:\s*(\d+\.?\d*)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    when: always
  only:
    - main
    - develop
    - merge_requests
  allow_failure: false

test:feature:
  stage: test
  image: ${IMAGE_NAME}:${IMAGE_TAG}
  services:
    - docker:24-dind
  before_script:
    - php -r "file_exists('.env') || copy('.env.example', '.env');"
    - cp .env.example .env
    - echo "DB_DATABASE=/tmp/database.sqlite" >> .env
    - composer install --no-interaction --no-progress
    - touch /tmp/database.sqlite
  script:
    - php artisan migrate --database=testing --force
    - php artisan test --testsuite=Feature --stop-on-failure
  artifacts:
    when: always
  only:
    - main
    - develop
    - merge_requests
  allow_failure: false

test:code-quality:
  stage: test
  image: ${IMAGE_NAME}:${IMAGE_TAG}
  before_script:
    - composer install --no-interaction --no-progress
  script:
    - php ./vendor/bin/pint --test app/
    - php ./vendor/bin/phpstan analyse app/ --level=5 || true
  only:
    - main
    - develop
    - merge_requests
  allow_failure: true

# === DEPLOY STAGE (Staging) ===

deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $STAGING_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $STAGING_USER@$STAGING_HOST "
        cd $STAGING_PATH &&
        git fetch origin &&
        git checkout ${CI_COMMIT_SHA} &&
        docker-compose pull &&
        docker-compose up -d &&
        docker-compose exec -T app php artisan migrate --force &&
        docker-compose exec -T app php artisan cache:clear &&
        docker-compose exec -T app php artisan config:clear
      "
  environment:
    name: staging
    url: https://staging.example.com
    deployment_tier: staging
  only:
    - develop
  when: manual
  allow_failure: false

# === NOTIFICATIONS ===

# Notificación de éxito en main
success:notification:
  stage: .post
  script:
    - echo "Pipeline ejecutado exitosamente"
  when: on_success
  only:
    - main

# Notificación de fallo
failure:notification:
  stage: .post
  script:
    - echo "Pipeline falló. Revisa los logs."
  when: on_failure
  only:
    - main
    - develop
