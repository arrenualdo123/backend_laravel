# GitLab CI/CD Pipeline para Laravel
stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY: "registry.gitlab.com"
  IMAGE_NAME: "${REGISTRY}/${CI_PROJECT_PATH}"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"

# === BUILD STAGE ===
build:image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} -t ${IMAGE_NAME}:latest .
    - docker push ${IMAGE_NAME}:${IMAGE_TAG}
    - docker push ${IMAGE_NAME}:latest
  only:
    - main
    - develop
    - merge_requests
  tags:
    - docker
  allow_failure: false

# === TEST STAGE ===
test:unit:
  stage: test
  image: ${IMAGE_NAME}:${IMAGE_TAG}
  variables:
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
    APP_ENV: testing
  before_script:
    - cp -r /app/vendor ./vendor
    # 💡 SOLUCIÓN: Creamos el archivo .env efímero para que key:generate pueda escribir en él
    - cp .env.example .env
  script:
    - php artisan config:clear
    - php artisan key:generate --env=testing
    - php artisan migrate --force
    - php artisan cache:clear
    - php artisan test --testsuite=Unit --stop-on-failure
  coverage: '/Lines:\s*(\d+\.?\d*)%/'
  only:
    - main
    - develop
    - merge_requests
  allow_failure: false

test:feature:
  stage: test
  image: ${IMAGE_NAME}:${IMAGE_TAG}
  variables:
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
    APP_ENV: testing
  before_script:
    - cp -r /app/vendor ./vendor
    # 💡 SOLUCIÓN: Lo mismo para la suite de integración
    - cp .env.example .env
  script:
    - php artisan config:clear
    - php artisan key:generate --env=testing
    - php artisan migrate --force
    - php artisan cache:clear
    - php artisan test --testsuite=Feature --stop-on-failure
  only:
    - main
    - develop
    - merge_requests
  allow_failure: false

test:code-quality:
  stage: test
  image: ${IMAGE_NAME}:${IMAGE_TAG}
  before_script:
    - cp -r /app/vendor ./vendor
  script:
    - php ./vendor/bin/pint --test app/ || true
    - php ./vendor/bin/phpstan analyse app/ --level=5 || true
  only:
    - main
    - develop
    - merge_requests
  allow_failure: true

# === SECURITY SCANS (DevSecOps) ===
security:semgrep:
  stage: test
  image: returntocorp/semgrep:latest
  before_script: []
  script:
    - semgrep --config p/ci --error --json --output semgrep-report.json .
  artifacts:
    paths:
      - semgrep-report.json
    reports:
      sast: semgrep-report.json
  only:
    - main
    - develop
    - merge_requests
  allow_failure: false

security:composer-audit:
  stage: test
  image: composer:2
  script:
    - composer audit --no-interaction
  only:
    - main
    - develop
    - merge_requests
  allow_failure: false

security:trivy:
  stage: test
  image: 
    name: aquasec/trivy:0.44.0
    entrypoint: [""]
  before_script:
    # 🔐 Autenticar Trivy en el registro de GitLab antes de escanear la imagen remota
    - export TRIVY_USERNAME=${CI_REGISTRY_USER}
    - export TRIVY_PASSWORD=${CI_REGISTRY_PASSWORD}
  script:
    # Escaneamos la imagen remota usando las credenciales del entorno
    - trivy image --exit-code 1 --severity CRITICAL ${IMAGE_NAME}:${IMAGE_TAG}
  only:
    - main
    - develop
    - merge_requests
  allow_failure: false

# === DEPLOY STAGE (Staging) ===
deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $STAGING_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $STAGING_USER@$STAGING_HOST "
        cd $STAGING_PATH &&
        git fetch origin &&
        git checkout ${CI_COMMIT_SHA} &&
        docker-compose pull &&
        docker-compose up -d &&
        docker-compose exec -T app php artisan migrate --force &&
        docker-compose exec -T app php artisan cache:clear &&
        docker-compose exec -T app php artisan config:clear
      "
  environment:
    name: staging
    url: https://staging.example.com
    deployment_tier: staging
  only:
    - develop
  when: manual
  allow_failure: false

# === NOTIFICATIONS ===
success:notification:
  stage: .post
  script:
    - echo "Pipeline ejecutado exitosamente"
  when: on_success
  only:
    - main

failure:notification:
  stage: .post
  script:
    - echo "Pipeline falló. Revisa los logs."
  when: on_failure
  only:
    - main
    - develop