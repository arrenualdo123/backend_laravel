# ==========================================
# GitLab CI/CD Pipeline - Laravel DevOps
# ==========================================

stages:
  - build
  - test
  - security
  - deploy

# ==========================================
# VARIABLES
# ==========================================

variables:
  DOCKER_DRIVER: overlay2
  REGISTRY: $CI_REGISTRY
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

cache:
  paths:
    - vendor/
    - .composer/cache

# ==========================================
# BUILD IMAGE
# ==========================================

build:image:
  stage: build

  image: docker:29.0.0

  before_script:
    - docker version
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest

  only:
    - main
    - develop
    - merge_requests

  tags:
    - docker

# ==========================================
# UNIT TESTS
# ==========================================

test:unit:
  stage: test

  image: $IMAGE_NAME:$IMAGE_TAG

  variables:
    APP_ENV: testing
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
    CACHE_DRIVER: array
    SESSION_DRIVER: array

  before_script:
    - cp .env.example .env

  script:
    - php artisan key:generate
    - php artisan config:clear
    - php artisan migrate --force
    - php artisan test --testsuite=Unit

  only:
    - main
    - develop
    - merge_requests

# ==========================================
# FEATURE TESTS
# ==========================================

test:feature:
  stage: test

  image: $IMAGE_NAME:$IMAGE_TAG

  variables:
    APP_ENV: testing
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
    CACHE_DRIVER: array
    SESSION_DRIVER: array

  before_script:
    - cp .env.example .env

  script:
    - php artisan key:generate
    - php artisan config:clear
    - php artisan migrate --force
    - php artisan test --testsuite=Feature

  only:
    - main
    - develop
    - merge_requests

# ==========================================
# CODE QUALITY
# ==========================================

test:code-quality:
  stage: test

  image: $IMAGE_NAME:$IMAGE_TAG

  script:
    - ./vendor/bin/pint --test app/
    - ./vendor/bin/phpstan analyse app --level=5

  allow_failure: true

  only:
    - main
    - develop
    - merge_requests

# ==========================================
# SEMGREP SECURITY SCAN
# ==========================================

security:semgrep:
  stage: security

  image: returntocorp/semgrep:latest

  script:
    - semgrep --config p/ci --error

  only:
    - main
    - develop
    - merge_requests

# ==========================================
# COMPOSER AUDIT
# ==========================================

security:composer-audit:
  stage: security

  image: composer:2

  script:
    - composer audit

  only:
    - main
    - develop
    - merge_requests

# ==========================================
# TRIVY IMAGE SCAN
# ==========================================

security:trivy:
  stage: security

  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  before_script:
    - export TRIVY_USERNAME=$CI_REGISTRY_USER
    - export TRIVY_PASSWORD=$CI_REGISTRY_PASSWORD

  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 $IMAGE_NAME:$IMAGE_TAG

  only:
    - main
    - develop
    - merge_requests

# ==========================================
# DEPLOY STAGING
# ==========================================

deploy:staging:
  stage: deploy

  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $STAGING_HOST >> ~/.ssh/known_hosts

  script:
    - |
      ssh $STAGING_USER@$STAGING_HOST "
      cd $STAGING_PATH &&
      docker compose pull &&
      docker compose up -d &&
      docker compose exec -T app php artisan migrate --force &&
      docker compose exec -T app php artisan optimize:clear
      "

  environment:
    name: staging
    url: https://staging.example.com

  only:
    - develop

  when: manual

# ==========================================
# SUCCESS NOTIFICATION
# ==========================================

success:notification:
  stage: .post

  script:
    - echo "Pipeline ejecutado exitosamente"

  when: on_success

  only:
    - main

# ==========================================
# FAILURE NOTIFICATION
# ==========================================

failure:notification:
  stage: .post

  script:
    - echo "Pipeline falló. Revisa los logs."

  when: on_failure

  only:
    - main
    - develop